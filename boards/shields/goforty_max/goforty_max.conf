CONFIG_ZMK_STUDIO=y
# Studio のロック。無効にすると BLE から Studio に繋げなくなる:
# キーボードは接続中アドバタイズを止めるので、ブラウザのデバイス選択に
# 出てこない。それを回避する ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK
# は「default y if ZMK_STUDIO_LOCKING」で、しかもフラグを立てるのは
# アンロックの瞬間だけなので、ロックが無いと一度も立たない。
# → 解除キーはレイヤー1の先頭 (&studio_unlock)。&lt_mid 1 で入る。
CONFIG_ZMK_STUDIO_LOCKING=y
# 接続中もアドバタイズを続ける。Kconfig の default は
# 「y if ZMK_STUDIO_LOCKING && ZMK_BLE」なので上の行でもう有効だが、
# BLE から繋がるかどうかがこの1行に懸かっているので明示しておく。
CONFIG_ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=192
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=192
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

CONFIG_ZMK_NON_LIPO_MIN_MV=2200
CONFIG_ZMK_NON_LIPO_MAX_MV=2600
CONFIG_ZMK_NON_LIPO_LOW_MV=2100

# --- Custom Studio Protocol: connection management ---
# (Keeb-On! Studio's Connection tab: BLE profile naming/switching/unpairing,
# per-connection and per-OS default layers.)
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y

CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=3
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# --- Custom Studio Protocol: macro & combo runtime editing ---
# (Keeb-On! Studio's Macro&Combo tab.)
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# --- Custom Studio Protocol: diagnostics & device settings ---
# (Keeb-On! Studio's Troubleshooting and Settings tabs.) Unibody board, so
# none of the split relay configuration applies.
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y

# Live key-press view during the kscan test (and in the keymap editor).
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# --- キーマップの高速読み込み ---
# 読み取り専用。フィンガープリントで差分だけ取るので、BLE接続時の
# キーマップ表示が速くなる。編集・保存は従来どおり公式プロトコル。
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y

# Diagnostics responses are large; a bigger TX buffer transfers them with
# fewer stalls.
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256

# --- タップダンス（アプリから編集可能） ---
# タップ回数ごとの割り当てと判定時間を settings に置く。スロットは最初は
# 空で、アプリで設定するまで押しても何も起きない。
CONFIG_ZMK_RUNTIME_TAP_DANCE=y
CONFIG_ZMK_RUNTIME_TAP_DANCE_COUNT=4
CONFIG_ZMK_RUNTIME_TAP_DANCE_MAX_TAPS=3
